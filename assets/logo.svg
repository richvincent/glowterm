<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 240" role="img" aria-labelledby="title desc">
  <title id="title">glowterm logo</title>
  <desc id="desc">A glowing terminal prompt over neon digital rain, beside the word glowterm and the tagline Your shell, with a light show behind it.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05080A"/>
      <stop offset="0.55" stop-color="#09100F"/>
      <stop offset="1" stop-color="#09070D"/>
    </linearGradient>

    <linearGradient id="frame" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00FFFF"/>
      <stop offset="0.42" stop-color="#00FF41"/>
      <stop offset="0.78" stop-color="#00FF41"/>
      <stop offset="1" stop-color="#FF2BD6"/>
    </linearGradient>

    <linearGradient id="rain" gradientUnits="userSpaceOnUse" x1="0" y1="40" x2="0" y2="153">
      <stop offset="0" stop-color="#00FF41" stop-opacity="0"/>
      <stop offset="0.62" stop-color="#00FF41" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#B8FFCA" stop-opacity="0.95"/>
    </linearGradient>

    <linearGradient id="wordGlow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#D8FFE2"/>
      <stop offset="0.18" stop-color="#00FF41"/>
      <stop offset="0.82" stop-color="#00FF41"/>
      <stop offset="1" stop-color="#55FFF5"/>
    </linearGradient>

    <radialGradient id="aura" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#00FF41" stop-opacity="0.22"/>
      <stop offset="0.55" stop-color="#00FFFF" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#00FF41" stop-opacity="0"/>
    </radialGradient>

    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>

    <clipPath id="screenClip">
      <rect x="44" y="47" width="150" height="146" rx="17"/>
    </clipPath>
  </defs>

  <rect x="5" y="5" width="710" height="230" rx="30" fill="url(#bg)" stroke="#18241F" stroke-width="2"/>
  <path d="M28 203 C155 145 251 223 372 177 S596 126 694 176" fill="none" stroke="#00FFFF" stroke-opacity="0.045" stroke-width="38" filter="url(#softGlow)"/>
  <ellipse cx="120" cy="120" rx="110" ry="106" fill="url(#aura)"/>

  <g clip-path="url(#screenClip)">
    <rect x="44" y="47" width="150" height="146" fill="#06100C"/>

    <g opacity="0.34" stroke="url(#rain)" stroke-width="3" stroke-linecap="round" filter="url(#glow)">
      <path d="M60 48v41"/>
      <path d="M72 68v61"/>
      <path d="M85 43v81"/>
      <path d="M99 78v52"/>
      <path d="M112 48v69"/>
      <path d="M126 69v84"/>
      <path d="M140 40v65"/>
      <path d="M153 59v78"/>
      <path d="M167 78v69"/>
      <path d="M181 49v67"/>
    </g>

    <g fill="#00FF41" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="10" opacity="0.48">
      <text x="56" y="67">ｱ</text>
      <text x="68" y="101">ﾒ</text>
      <text x="81" y="81">ﾄ</text>
      <text x="95" y="111">ﾘ</text>
      <text x="108" y="87">ｶ</text>
      <text x="122" y="133">ﾈ</text>
      <text x="136" y="76">ｵ</text>
      <text x="149" y="116">ﾝ</text>
      <text x="163" y="128">ｻ</text>
      <text x="177" y="96">ｲ</text>
    </g>

    <path d="M44 156 C70 139 82 159 106 143 S145 129 194 150 V193 H44Z" fill="#00FFFF" opacity="0.055"/>
    <path d="M44 172 C77 148 103 183 132 153 S170 145 194 160 V193 H44Z" fill="#FF2BD6" opacity="0.05"/>

    <rect x="56" y="137" width="126" height="42" rx="8" fill="#020806" fill-opacity="0.86" stroke="#00FF41" stroke-opacity="0.3"/>
    <path d="M69 150l10 8-10 8" fill="none" stroke="#00FF41" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
    <rect x="86.5" y="163.5" width="29" height="5" rx="2.5" fill="#00FFFF" filter="url(#glow)"/>
    <rect x="122" y="149" width="7" height="18" rx="1.5" fill="#FF2BD6" filter="url(#glow)"/>
  </g>

  <rect x="38" y="38" width="162" height="164" rx="23" fill="none" stroke="url(#frame)" stroke-width="4" filter="url(#glow)"/>
  <rect x="38" y="38" width="162" height="164" rx="23" fill="none" stroke="url(#frame)" stroke-width="2"/>
  <path d="M39 70h160" stroke="#00FF41" stroke-opacity="0.55" stroke-width="2"/>
  <circle cx="56" cy="54" r="4" fill="#FF2BD6" filter="url(#glow)"/>
  <circle cx="70" cy="54" r="4" fill="#00FFFF" filter="url(#glow)"/>
  <circle cx="84" cy="54" r="4" fill="#00FF41" filter="url(#glow)"/>

  <g font-family="ui-monospace, Menlo, Consolas, monospace">
    <text x="229" y="133" font-size="65" font-weight="700" letter-spacing="-4" fill="#00FF41" opacity="0.3" filter="url(#glow)">glowterm</text>
    <text x="229" y="133" font-size="65" font-weight="700" letter-spacing="-4" fill="url(#wordGlow)">glowterm</text>
    <path d="M234 151h425" stroke="#00FF41" stroke-opacity="0.16" stroke-width="2"/>
    <circle cx="649" cy="151" r="3" fill="#FF2BD6" filter="url(#glow)"/>
    <text x="232" y="178" font-size="16" letter-spacing="0.15" fill="#AFC8B8">Your shell, with a light show behind it.</text>
  </g>
</svg>
